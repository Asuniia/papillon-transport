name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check && pnpm typecheck && pnpm build
      - name: Debug npm OIDC (temporary)
        run: |
          id_token=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          echo "::add-mask::$id_token"
          node -e 'const c = JSON.parse(Buffer.from(process.argv[1].split(".")[1], "base64url").toString()); const { repository, repository_owner, workflow_ref, job_workflow_ref, ref, environment } = c; console.log({ repository, repository_owner, workflow_ref, job_workflow_ref, ref, environment });' "$id_token"
          curl -sS -o response.json -w "HTTP %{http_code}\n" -X POST -H "Authorization: Bearer $id_token" -H "Content-Length: 0" https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/papillon-transport
          jq 'del(.token)' response.json
          rm -f response.json
      - name: Open the version pull request or publish to npm
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51
        with:
          version-script: pnpm run bump
          publish-script: pnpm run release
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
          github-token: ${{ steps.app-token.outputs.token }}
